name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 8 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test SARIF filter
        if: matrix.language == 'java-kotlin'
        run: bash .github/codeql/test-filter-node-modules.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        working-directory: my-app
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Java/Kotlin
        if: matrix.language == 'java-kotlin'
        run: |
          cd my-app/android
          ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: failure-only

      - name: Remove node_modules results from SARIF
        shell: bash
        run: |
          sarif_files=()
          while IFS= read -r -d '' sarif_file; do
            sarif_files+=("$sarif_file")
          done < <(find sarif-results -type f -name '*.sarif' -print0)

          if (( ${#sarif_files[@]} == 0 )); then
            echo "No SARIF files found" >&2
            exit 1
          fi

          for sarif_file in "${sarif_files[@]}"; do
            jq --from-file .github/codeql/filter-node-modules.jq \
              "$sarif_file" >"${sarif_file}.filtered"
            mv "${sarif_file}.filtered" "$sarif_file"
          done

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"
