name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 8 * * 2'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin needs a full `expo prebuild` + `assembleDebug`, which runs 20-31 min against
        # ~2 min for the other two languages. What it can actually extract is one file —
        # my-app/modules/stockfish/.../StockfishModule.kt, the repo's only hand-written native
        # source. That file is worth analyzing (it spawns a ProcessBuilder and writes a
        # JS-supplied FEN to its stdin), but not on every push to a PR, so it is skipped on
        # pull_request and left to push-to-main, the weekly cron, and workflow_dispatch.
        #
        # It is NOT skipped because the Kotlin comes from ber4444/compose-multiplatform-chess.
        # Two reasons that argument does not hold: CodeQL extracts source in the repo where it
        # runs, never a dependency's jar; and chess-core/ + on-device-ai/ only have a js(IR)
        # target, while the extractor hooks the Kotlin *JVM* compiler — so no build step added
        # here could bring them into scope. (Upstream's own java-kotlin job is additionally
        # `continue-on-error` while the CodeQL CLI tops out at Kotlin 2.4.0, so it reports green
        # without extracting anything. This repo's Android build is on Kotlin 2.1.20 via React
        # Native's libs.versions.toml and does extract: 76 rules, 0 results.)
        #
        # This selection lives in the matrix, NOT in a job-level `if:` — `jobs.<job_id>.if` is
        # evaluated before the matrix expands and so has no `matrix` context.
        #
        # build-mode is derived in the init step rather than via `include:`, because an `include`
        # entry whose language is absent from the list creates a *new* combination instead of
        # annotating one, which would silently add java-kotlin back on pull requests.
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["actions","javascript-typescript"]' || '["actions","javascript-typescript","java-kotlin"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test SARIF filter
        if: matrix.language == 'java-kotlin'
        run: bash .github/codeql/test-filter-node-modules.sh

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        working-directory: my-app
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ (matrix.language == 'java-kotlin' && 'manual') || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Java/Kotlin
        if: matrix.language == 'java-kotlin'
        run: |
          cd my-app
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: failure-only

      - name: Remove node_modules results from SARIF
        shell: bash
        run: |
          sarif_files=()
          while IFS= read -r -d '' sarif_file; do
            sarif_files+=("$sarif_file")
          done < <(find sarif-results -type f -name '*.sarif' -print0)

          if (( ${#sarif_files[@]} == 0 )); then
            echo "No SARIF files found" >&2
            exit 1
          fi

          for sarif_file in "${sarif_files[@]}"; do
            jq --from-file .github/codeql/filter-node-modules.jq \
              "$sarif_file" >"${sarif_file}.filtered"
            mv "${sarif_file}.filtered" "$sarif_file"
          done

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: "/language:${{ matrix.language }}"
