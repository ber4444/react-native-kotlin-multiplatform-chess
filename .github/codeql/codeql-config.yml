name: repo-codeql-config

paths:
  # chess-core/ and on-device-ai/ are deliberately absent. Their Kotlin only has a js(IR) target,
  # and the java-kotlin extractor hooks the Kotlin *JVM* compiler, so listing them here implies
  # coverage that no analysis can deliver — the compiled output lands in my-app/src/generated,
  # which is ignored below as generated code. Keeping chess-core in this list made the java-kotlin
  # job look like it was analyzing the engine wrapper when its only real subject is
  # my-app/modules/stockfish.
  - .github/workflows
  - my-app/electron
  - my-app/modules
  - my-app/scripts
  - my-app/src
  - my-app/babel.config.js
  - my-app/eslint.config.js
  - my-app/metro.config.js

paths-ignore:
  - my-app/android/**
  - my-app/modules/*/android/build/**
  - my-app/ios/Pods/**
  - my-app/node_modules/**
  - my-app/public/stockfish-18-lite-single.js
  - my-app/src/components/chess/piece-paths.generated.ts
  - my-app/src/components/chess/three-renderer/*.generated.js
  - my-app/src/generated/**
